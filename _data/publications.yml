# Source of truth for the Publications page (publications.html renders from this)
# and the JSON-LD structured data. New entries are appended by the Scholar fetch
# pipeline into publications.draft.yml for you to validate before moving them here.
#
# Fields:
#   title         Publication title
#   authors       Ordered list of author names (the author matching site config is bolded)
#   year          Publication year
#   venue         Journal/publisher name (used in JSON-LD "isPartOf")
#   venue_display Optional override for the line shown on the card (defaults to venue)
#   url           Link to the publication
#   image         Thumbnail under /assets/images/publications/
#   anchor        Optional id= for deep links (e.g. projects.html#interactive-sim-framework)
#   scholar_id    Optional Google Scholar cluster id, used by the fetch script to dedupe

