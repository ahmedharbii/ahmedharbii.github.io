name: Website Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true

    - name: Build site with Jekyll
      run: bundle exec jekyll build

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run website tests against built site
      env:
        SITE_DIR: _site
      run: python tests/test_website.py

    - name: Check HTML validity (optional)
      continue-on-error: true
      run: |
        sudo apt-get update
        sudo apt-get install -y tidy
        for file in _site/*.html; do
          echo "Checking $file"
          tidy -q -e "$file" || true
        done
